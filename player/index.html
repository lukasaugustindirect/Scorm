<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course</title>
<link rel="stylesheet" href="player.css">
</head>
<body>
<div class="viewer" id="viewer">

  <header class="bar bar--top">
    <button class="icon-btn" id="toggle-thumbs" aria-expanded="false" aria-controls="thumbs"
            title="Show page thumbnails">
      <span class="icon-bars" aria-hidden="true"></span>
      <span class="sr-only">Show page thumbnails</span>
    </button>

    <h1 class="course-title" id="course-title">Course</h1>

    <div class="bar__right">
      <span class="status" id="lms-status" role="status"></span>
      <button class="icon-btn" id="zoom-mode" title="Fit width">
        <span aria-hidden="true">⤢</span><span class="sr-only">Change zoom</span>
      </button>
      <button class="icon-btn" id="fullscreen" title="Full screen">
        <span aria-hidden="true">⛶</span><span class="sr-only">Toggle full screen</span>
      </button>
    </div>
  </header>

  <div class="body">
    <nav class="thumbs" id="thumbs" aria-label="Pages" hidden></nav>

    <main class="stage" id="stage" tabindex="0" aria-label="Page content">
      <figure class="page" id="page-figure">
        <img class="page__img" id="page-img" alt="">
        <figcaption class="sr-only" id="page-text"></figcaption>
      </figure>
      <p class="loading" id="loading">Loading…</p>
    </main>
  </div>

  <footer class="bar bar--bottom">
    <button class="nav-btn" id="prev">
      <span aria-hidden="true">‹</span> Previous
    </button>

    <div class="progress-group">
      <label class="sr-only" for="page-input">Page number</label>
      <input class="page-input" id="page-input" type="number" min="1" value="1" inputmode="numeric">
      <span class="page-count">/ <span id="page-total">?</span></span>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" aria-label="Pages viewed" id="progress">
        <div class="progress__fill" id="progress-fill"></div>
      </div>
      <span class="progress-label" id="progress-label">0% viewed</span>
    </div>

    <button class="nav-btn" id="next">
      Next <span aria-hidden="true">›</span>
    </button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<!-- The adapter is chosen when the package is built; it defines window.PdfScormAdapter. -->
<script src="lms-adapter.js"></script>
<script src="player.js"></script>
</body>
</html>
